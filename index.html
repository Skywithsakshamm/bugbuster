    <meta charset="UTF-8" />

    <title>BugBuster — Find it. Fix it. Prove it.</title>
    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          var activeFetch = origFetch;
          function patchFetchProp(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                }
              });
            } catch (e) {}
          }
          patchFetchProp(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchFetchProp(Window.prototype);
          }
          if (typeof globalThis !== 'undefined') {
            patchFetchProp(globalThis);
          }
        } catch (e) {}
      })();
    </script>
